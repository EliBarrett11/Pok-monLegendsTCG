<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Legends v2 — in development</title>
  <!-- v2 is a separate game (docs/v2-design.md). It shares the root assets/ folder by
       relative path and may import root src/ modules; it never changes them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel:wght@600;700;800&display=swap">
  <link rel="preload" as="image" href="../assets/ui/table.jpg">
  <link rel="preload" as="image" href="../assets/ui/board-mat.jpg">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <!-- A fixed 1920×1080 stage, scaled to fit the window (src/main.js). -->
  <div id="stage">
    <main id="app"></main>
    <!-- V8: the effects layer (WebGL, the current game's engine) and its 2D fallback. -->
    <canvas id="vfx" width="1920" height="1080" hidden></canvas>
    <canvas id="particles" width="1920" height="1080"></canvas>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
