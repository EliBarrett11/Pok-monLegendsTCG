<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Legends TCG</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <!-- A fixed 1920×1080 stage, scaled to fit the window (see main.js). -->
  <div id="stage">
    <header class="title">
      <h1>Pokémon Legends TCG</h1>
      <span id="build-tag"></span>
    </header>
    <main id="app"></main>
    <!-- Reveals, arrows, numbers and banners while actions play out. -->
    <div id="fx"></div>
    <!-- Covers the board while actions play out; a click skips to the end of the current one. -->
    <div id="lock" title="Click to skip"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
