<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Legends TCG</title>
  <!-- Fonts: Cinzel for names, headings and banners; Alegreya Sans for card text and numbers. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel:wght@600;700;800&display=swap">
  <!-- The tabletop art, fetched up front so nothing pops in (main.js waits for it). -->
  <link rel="preload" as="image" href="assets/ui/table.jpg">
  <link rel="preload" as="image" href="assets/ui/board-mat.jpg">
  <link rel="preload" as="image" href="assets/ui/card-back.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-pokemon.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-strategy.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-item.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-location.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-supporter.jpg">
  <link rel="preload" as="image" href="assets/ui/frame-trainer.jpg">
  <script>
    // Cache busting: every game file is loaded with ?v=<when this page was
    // deployed>, so after an update the browser never runs a cached mix of
    // old and new files. The version changes by itself with every deploy (the
    // page's Last-Modified time); nothing to bump by hand. Every module is
    // listed here (tests/version.test.js checks the list is complete).
    (() => {
      const version = Date.parse(document.lastModified) || Date.now();
      const MODULES = [
        'src/main.js',
        'src/ai/opponent.js',
        'src/engine/board.js', 'src/engine/cardData.js', 'src/engine/cards.js', 'src/engine/effects.js',
        'src/engine/energy.js', 'src/engine/game.js', 'src/engine/keywords.js', 'src/engine/random.js', 'src/engine/status.js',
        'src/ui/cardIcons.js', 'src/ui/deckSelect.js', 'src/ui/icons.js', 'src/ui/interact.js', 'src/ui/medallions.js', 'src/ui/particles.js',
        'src/ui/present.js', 'src/ui/render.js', 'src/ui/resources.js', 'src/ui/settings.js',
      ];
      const url = (path) => new URL(path, location.href).href;
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: Object.fromEntries(MODULES.map((m) => [url(m), `${url(m)}?v=${version}`])) });
      document.currentScript.after(map);
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `src/ui/style.css?v=${version}`;
      document.head.append(css);
    })();
  </script>
</head>
<body>
  <!-- A fixed 1920×1080 stage, scaled to fit the window (see main.js). -->
  <div id="stage">
    <main id="app"></main>
    <!-- Particles for combat and effects (particles.js): one canvas over the stage. -->
    <canvas id="particles" width="1920" height="1080"></canvas>
    <!-- Reveals, arrows, numbers and banners while actions play out. -->
    <div id="fx"></div>
    <!-- Covers the board while actions play out; a click skips to the end of the current one. -->
    <div id="lock" title="Click to skip"></div>
    <!-- A card being dragged, and the targeting arrow (interact.js). -->
    <div id="drag"></div>
    <!-- Right-click a card: the inspect view (interact.js). -->
    <div id="inspect" hidden></div>
  </div>
  <script type="module">import './src/main.js';</script>
</body>
</html>
