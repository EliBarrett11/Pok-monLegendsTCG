<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel:wght@500;600;700&display=swap">
<style>
:root{--disp:'Cinzel',Georgia,serif;--text:'Alegreya Sans',system-ui,sans-serif;--brass:#c2a36a;--brassd:#6e5530}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:var(--text);color:#ece2cc;background:radial-gradient(ellipse at 50% 30%,#2a2119 0%,#130f0b 60%,#080605 100%)}
.lab{position:absolute;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.22em;color:#9c8862;text-transform:uppercase}
.call{position:absolute;font-size:13.5px;color:#cbbd9f;line-height:1.35}
.call b{color:#e6cf9a;font-weight:700}
.cw{position:absolute;width:340px;height:476px;transform-origin:0 0}
.cw svg.fr{position:absolute;left:0;top:0;width:340px;height:476px;overflow:visible;filter:drop-shadow(0 18px 26px rgba(0,0,0,.7)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.t{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center}
.name{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.06em;color:#f3ead6;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.type{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.rules{font-size:14.5px;line-height:1.28;color:#e4d9c2;flex-direction:column;gap:4px}
.rules b{font-weight:700;color:#e9cf93}
.rules i{font-style:normal;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--acc)}
.num{font-family:var(--disp);font-weight:600;color:#f6efe0;font-size:25px;line-height:1;text-shadow:0 1px 2px #000}
.mrow{position:absolute;left:30px;right:30px;height:24px;display:flex;align-items:center;font-size:14px;color:#e4d9c2;white-space:nowrap;border-bottom:1px solid rgba(194,163,106,.18)}
.mrow b{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:#d9be86;width:70px;text-transform:uppercase}
.mrow .c{margin-left:auto;font-family:var(--disp);font-weight:600;font-size:13px;color:#bfd8f2;display:flex;align-items:center;gap:4px}
.mrow.off{opacity:.32}
.chip{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:#e6cf9a;padding:3px 10px;border:1px solid rgba(194,163,106,.55);border-radius:3px;background:rgba(10,7,5,.75);white-space:nowrap;text-transform:uppercase}
</style></head><body>
<div id="app"></div>
<script>
const ART=(n)=>`../../assets/cards/${n}.jpg`;
const W=340,H=476;
const ACC={fire:'#d9773f',water:'#5f9bd6',elec:'#d7b440',rock:'#b39a6c',normal:'#b7ad9a',sup:'#c46a6a',item:'#5fb59a',trn:'#a786d6',loc:'#c2a36a'};
const G={
 pa:'<path d="M5 16C7 11 10 7 15 4M9 19.5c2.5-5 5.5-8.5 11-11.5M13 22c2-3.5 4.5-6 8-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 sa:'<path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="currentColor"/>',
 hp:'<path d="M12 20.5s-7.5-4.8-7.5-10.2a4.2 4.2 0 0 1 7.5-2.6 4.2 4.2 0 0 1 7.5 2.6c0 5.4-7.5 10.2-7.5 10.2z" fill="currentColor"/>',
 def:'<path d="M12 2.5l7.5 2.8v5.8c0 4.8-3.3 8.4-7.5 10.4-4.2-2-7.5-5.6-7.5-10.4V5.3z" fill="currentColor"/>',
 sdef:'<path d="M12 2.5l8 4.6v9.8L12 21.5l-8-4.6V7.1z" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
 fire:'<path d="M12 2.5c1 3.8 4.8 5.8 4.8 10.6a4.8 4.8 0 0 1-9.6 0c0-2.8 1.9-3.8 1.9-6.6 1.9 1 2.9 2.8 2.9 4.7 1-1.9 0-5.7 0-8.7z" fill="currentColor"/>',
 water:'<path d="M12 3.5s5.6 6.6 5.6 10.4a5.6 5.6 0 0 1-11.2 0c0-3.8 5.6-10.4 5.6-10.4z" fill="currentColor"/>',
 elec:'<path d="M13 2.5L5.5 13.5h5.6l-1 8 7.4-11h-5.6z" fill="currentColor"/>',
 rock:'<path d="M4 18l4.5-9 4.5 3 3-6 4 12z" fill="currentColor"/>',
 normal:'<circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/>',
 sup:'<circle cx="12" cy="8" r="3.6" fill="currentColor"/><path d="M5 20c0-4.4 3.4-6.4 7-6.4s7 2 7 6.4z" fill="currentColor"/>',
 item:'<path d="M9.5 3.5h5v2.8l2.8 3.6v8.6a1.8 1.8 0 0 1-1.8 1.8H8.5a1.8 1.8 0 0 1-1.8-1.8V9.9l2.8-3.6z" fill="currentColor"/>',
 trn:'<path d="M12 3l2.6 5.4 5.9.9-4.3 4.1 1 5.9L12 16.6l-5.2 2.7 1-5.9L3.5 9.3l5.9-.9z" fill="currentColor"/>',
 loc:'<path d="M12 2.5a6.5 6.5 0 0 1 6.5 6.5c0 4.8-6.5 12.5-6.5 12.5S5.5 13.8 5.5 9A6.5 6.5 0 0 1 12 2.5z" fill="currentColor"/><circle cx="12" cy="9" r="2.4" fill="#0b0705"/>',
 en:'<path d="M13 2.5L6 13h5l-1 8.5 7-10.5h-5z" fill="currentColor"/>',
};
const SC={pa:'#d98a55',sa:'#a98ad8',hp:'#d9798a',def:'#b9c3cf',sdef:'#6fc2d6'};
const gl=(k,x,y,s,col)=>`<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${col}">${G[k]}</svg>`;
let uid=0;

// ---- silhouettes: near-rectangles, each with one distinct trait. i = inset ----
const R=10;
const SH={
 // Pokémon: chamfered top corners
 pokemon:(i)=>{const c=16-i*.4;return `M${i+c},${i} H${W-i-c} L${W-i},${i+c} V${H-i-R} Q${W-i},${H-i} ${W-i-R},${H-i} H${i+R} Q${i},${H-i} ${i},${H-i-R} V${i+c} Z`;},
 // Command: a shallow notch in the top edge that seats the cost
 command:(i)=>`M${i+R},${i} H${W/2-30} C${W/2-18},${i} ${W/2-16},${i+14} ${W/2},${i+14} C${W/2+16},${i+14} ${W/2+18},${i} ${W/2+30},${i} H${W-i-R} Q${W-i},${i} ${W-i},${i+R} V${H-i-R} Q${W-i},${H-i} ${W-i-R},${H-i} H${i+R} Q${i},${H-i} ${i},${H-i-R} V${i+R} Q${i},${i} ${i+R},${i} Z`,
 // Supporter: a gentle arch on the top edge
 supporter:(i)=>`M${i},${i+22} Q${W/2},${i-12} ${W-i},${i+22} V${H-i-R} Q${W-i},${H-i} ${W-i-R},${H-i} H${i+R} Q${i},${H-i} ${i},${H-i-R} Z`,
 // Item: rounded tag with a punched eyelet notch
 item:(i)=>`M${i+16},${i} H${W/2-16} A16,16 0 0 0 ${W/2+16},${i} H${W-i-16} Q${W-i},${i} ${W-i},${i+16} V${H-i-16} Q${W-i},${H-i} ${W-i-16},${H-i} H${i+16} Q${i},${H-i} ${i},${H-i-16} V${i+16} Q${i},${i} ${i+16},${i} Z`,
 // Trainer: a low central peak
 trainer:(i)=>`M${i},${i+18} L${W/2-46},${i+18} L${W/2},${i-4} L${W/2+46},${i+18} L${W-i},${i+18} V${H-i-R} Q${W-i},${H-i} ${W-i-R},${H-i} H${i+R} Q${i},${H-i} ${i},${H-i-R} Z`,
 // Location: square body between two scroll rolls
 location:(i)=>`M${i+6},${i+14} H${W-i-6} V${H-i-14} H${i+6} Z`,
};
function frame(shape,acc,opts={}){
 const o=SH[shape](0),inner=SH[shape](7);const c='c'+(++uid),sc='s'+uid,br='b'+uid;
 const panelTop=opts.panel??300;
 return {defs:`<clipPath id="${c}"><path d="${o}"/></clipPath>
  <linearGradient id="${sc}" x1="0" y1="0" x2="0" y2="1"><stop offset="${(panelTop-90)/H}" stop-color="#0a0705" stop-opacity="0"/><stop offset="${(panelTop-10)/H}" stop-color="#0a0705" stop-opacity=".78"/><stop offset="${(panelTop+20)/H}" stop-color="#0a0705" stop-opacity=".92"/><stop offset="1" stop-color="#070504" stop-opacity=".97"/></linearGradient>
  <linearGradient id="${br}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c88f"/><stop offset=".4" stop-color="#8f7140"/><stop offset=".6" stop-color="#d4b67c"/><stop offset="1" stop-color="#6e5530"/></linearGradient>`,
  art:`<g clip-path="url(#${c})"><image href="${ART(opts.art)}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/><rect width="${W}" height="${H}" fill="url(#${sc})"/>${opts.noPanel?'':`<rect y="${panelTop}" width="${W}" height="${H-panelTop}" fill="rgba(8,6,4,.18)"/>`}</g>`,
  lines:`<path d="${o}" fill="none" stroke="#050302" stroke-width="3"/><path d="${o}" fill="none" stroke="url(#${br})" stroke-width="1.6"/><path d="${inner}" fill="none" stroke="rgba(194,163,106,.55)" stroke-width="1"/>`
   +(opts.noPanel?'':`<path d="M24,${panelTop} H${W/2-12} M${W/2+12},${panelTop} H${W-24}" stroke="url(#${br})" stroke-width="1"/><path d="M${W/2},${panelTop-5} L${W/2+5},${panelTop} L${W/2},${panelTop+5} L${W/2-5},${panelTop}Z" fill="${acc}" stroke="#e2c88f" stroke-width=".8"/>`),
  br};
}
// cost socket: a small dark well with a fine ring, set into the frame
function costWell(cx,cy,n,kind,br){
 const ring={energy:'#7fb2e6',money:'#e2c070',seal:'#d07070'}[kind];
 return {svg:`<circle cx="${cx}" cy="${cy}" r="21" fill="#0b0806" stroke="url(#${br})" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="17" fill="none" stroke="${ring}" stroke-width="1" opacity=".75"/>`,
  html:`<div class="t num" style="left:${cx-21}px;top:${cy-21}px;width:42px;height:42px;font-size:${String(n).length>1?18:23}px;color:${kind==='money'?'#f0d590':'#eef4fb'}">${n}</div>`};}
function crest(cx,cy,k,acc,br){return `<circle cx="${cx}" cy="${cy}" r="13" fill="#0b0806" stroke="url(#${br})" stroke-width="1.2"/>${gl(k,cx-8,cy-8,16,acc)}`;}
// stat tabs: flush into the bottom corners; the inner hairline steps around them
function statTabs(at,a,gt,s,hurt,br){
 const tw=64,th=46,y=H-7-th;
 const L=`M7,${y} H${7+tw-8} Q${7+tw},${y} ${7+tw},${y+8} V${H-7}`, Rr=`M${W-7},${y} H${W-7-tw+8} Q${W-7-tw},${y} ${W-7-tw},${y+8} V${H-7}`;
 return {svg:`<path d="M7,${y} H${7+tw-8} Q${7+tw},${y} ${7+tw},${y+8} V${H-7} H${7+R-4} Q7,${H-7} 7,${H-7-R+4} Z" fill="rgba(10,7,5,.92)"/>
  <path d="M${W-7},${y} H${W-7-tw+8} Q${W-7-tw},${y} ${W-7-tw},${y+8} V${H-7} H${W-7-R+4} Q${W-7},${H-7} ${W-7},${H-7-R+4} Z" fill="rgba(10,7,5,.92)"/>
  <path d="${L}" fill="none" stroke="url(#${br})" stroke-width="1.2"/><path d="${Rr}" fill="none" stroke="url(#${br})" stroke-width="1.2"/>
  ${gl(at,17,y+15,15,SC[at])}${gl(gt,W-7-tw+10,y+15,15,SC[gt])}`,
 html:`<div class="t num" style="left:32px;top:${y}px;width:36px;height:${th}px">${a}</div><div class="t num" style="left:${W-7-tw+26}px;top:${y}px;width:36px;height:${th}px;${hurt?'color:#e0705e':''}">${s}</div>`};}

function card(o){ // dispatch
 const acc=ACC[o.type]||ACC.loc;let svg='',html='',defs='';
 const shape=o.kind;const full=o.lod!=='mini';
 const panel=o.kind==='command'?(full?262:318):(full?300:350);
 const f=frame(shape,acc,{art:o.art,panel,noPanel:o.kind==='location'&&false});
 defs+=f.defs;svg+=f.art;
 const nameY=panel+10, typeY=panel+40;
 if(o.kind==='location'){
  const roll=(y)=>`<rect x="2" y="${y}" width="${W-4}" height="16" rx="8" fill="url(#rl${uid})" stroke="#050302" stroke-width="1.5"/>`;
  defs+=`<linearGradient id="rl${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c08c"/><stop offset=".5" stop-color="#7a6038"/><stop offset="1" stop-color="#2e2214"/></linearGradient>`;
  svg+=f.lines+roll(6)+roll(H-22)+crest(W/2,40,'loc',acc,f.br);
 } else svg+=f.lines;
 // cost
 if(o.cost!=null){const pos=o.kind==='command'?[W/2,22]:o.kind==='trainer'?[34,48]:o.kind==='supporter'?[36,48]:[32,32];
  const cw=costWell(pos[0],pos[1],o.cost,o.costKind||'energy',f.br);svg+=cw.svg;html+=cw.html;
}
 // crest
 if(o.kind!=='location'){const cp=o.kind==='trainer'?[W-34,48]:o.kind==='supporter'?[W-36,48]:o.kind==='command'?[W-32,30]:[W-32,32];svg+=crest(cp[0],cp[1],o.icon||o.type,acc,f.br);}
 // name + type line
 html+=`<div class="t name" style="left:20px;top:${nameY}px;width:${W-40}px;height:28px;${full?'':'font-size:26px'}">${o.name}</div>`;
 if(full||o.kind==='location') html+=`<div class="t type" style="left:20px;top:${nameY+30}px;width:${W-40}px;height:14px;color:${acc}">${o.typeLine}</div>`;
 const rTop=typeY+18;
 if(o.kind==='pokemon'){
  const st=statTabs(o.at,o.a,o.gt,o.s,o.hurt,f.br);svg+=st.svg;html+=st.html;
  html+=`<div class="t" style="left:80px;top:${H-50}px;width:${W-160}px;height:40px;gap:10px;font-family:var(--disp);font-size:12px;letter-spacing:.14em;color:#b8a57e">${o.lv?`LV ${o.lv}`:'★ PARTNER'}<span style="color:#8fc9a0;letter-spacing:-.05em;font-size:15px">${'›'.repeat(o.spd)}</span></div>`;
  if(full) html+=`<div class="t rules" style="left:30px;top:${rTop}px;width:${W-60}px;height:${H-56-rTop}px;--acc:${acc}">${o.kw?`<div><i>${o.kw.join(' · ')}</i></div>`:''}${o.rules}</div>`;
  else if(o.tag) html+=`<div class="t" style="left:20px;top:${panel-34}px;width:${W-40}px;height:24px"><span class="chip" style="font-size:13px">${o.tag}</span></div>`;
 }
 if(o.kind==='command'){
  if(full) o.modes.forEach((m,k)=>html+=`<div class="mrow ${m.off?'off':''}" style="top:${rTop+k*30}px"><b>${m.n}</b>${m.t}<span class="c"><svg width="12" height="12" viewBox="0 0 24 24" style="color:#7fb2e6">${G.en}</svg>${m.c}</span></div>`);
  else html+=`<div class="t" style="left:20px;top:${nameY+40}px;width:${W-40}px;height:28px;gap:8px">${o.modes.filter(m=>!m.off).map(m=>`<span class="chip" style="font-size:13px">${m.n} ${m.c}</span>`).join('')}</div>`;
 }
 if(o.kind==='supporter'&&full){
  html+=`<div class="t rules" style="left:30px;top:${rTop}px;width:${W-60}px;height:30px">${o.rules}</div>`;
  svg+=`<rect x="26" y="${rTop+38}" width="${W-52}" height="${H-rTop-56}" rx="3" fill="rgba(194,163,106,.08)" stroke="rgba(194,163,106,.45)" stroke-width="1"/>`;
  html+=`<div class="t rules" style="left:36px;top:${rTop+42}px;width:${W-72}px;height:${H-rTop-64}px;font-size:13.5px;--acc:#e6cf9a"><div><i>Favour</i></div><div>${o.fav}</div></div>`;
 }
 if(o.kind==='item'&&full){
  html+=`<div class="t rules" style="left:30px;top:${rTop}px;width:${W-60}px;height:58px">${o.rules}</div>`;
  const n=o.stock;for(let k=0;k<n;k++) svg+=`<rect x="${W/2-n*9+k*18+4}" y="${H-46}" width="10" height="10" transform="rotate(45 ${W/2-n*9+k*18+9} ${H-41})" fill="${k<o.left?acc:'none'}" stroke="${acc}" stroke-width="1"/>`;
  html+=`<div class="t type" style="left:20px;top:${H-30}px;width:${W-40}px;height:12px;color:#9cc9b6;font-size:9.5px">Stock · ${o.left} of ${o.stock} turns</div>`;
 }
 if(o.kind==='trainer'){
  html+=`<div class="t rules" style="left:30px;top:${rTop}px;width:${W-60}px;height:44px;--acc:${acc}"><div><b>Command</b> · ${o.cmd}</div><div><b>Objective</b> · ${o.obj}</div></div>`;
  const pc='p'+(++uid);defs+=`<clipPath id="${pc}"><circle cx="${W-50}" cy="${H-40}" r="19"/></clipPath>`;
  for(let k=0;k<o.need;k++) svg+=`<circle cx="${42+k*22}" cy="${H-40}" r="5.5" fill="${k<o.prog?'#e6cf9a':'none'}" stroke="#c2a36a" stroke-width="1.2"/>`;
  svg+=`<path d="M${42+(o.need-1)*22+10},${H-40} H${W-74}" stroke="rgba(194,163,106,.45)" stroke-width="1" stroke-dasharray="2 4"/><image href="${ART(o.partner)}" x="${W-70}" y="${H-60}" width="40" height="40" clip-path="url(#${pc})" preserveAspectRatio="xMidYMid slice"/><circle cx="${W-50}" cy="${H-40}" r="19.5" fill="none" stroke="url(#${f.br})" stroke-width="1.4"/>`;
  html+=`<div class="t type" style="left:30px;top:${H-24}px;width:160px;height:12px;color:#a991cf;font-size:9.5px;justify-content:flex-start">${o.prog} of ${o.need} · Partner</div>`;
 }
 if(o.kind==='location'){
  html+=`<div class="t rules" style="left:30px;top:${rTop}px;width:${W-60}px;height:40px">${o.rules}</div>`;
  html+=`<div class="t" style="left:30px;top:${rTop+52}px;width:${W-60}px;height:24px;gap:10px"><span class="chip" style="color:#e0a868;border-color:rgba(217,119,63,.6)">Sun +2</span><span class="chip">Dominate · +3 Recognition</span></div>`;
 }
 return `<svg class="fr" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${svg}</svg>${html}`;
}
// board token: the Pokémon frame, shorter panel, no rules
function token(o){
 const acc=ACC[o.type];const f=frame('pokemon',acc,{art:o.art,panel:392});
 const st=statTabs(o.at,o.a,o.gt,o.s,o.hurt,f.br);
 let svg=f.art+f.lines+st.svg,html=st.html;
 html+=`<div class="t name" style="left:20px;top:396px;width:${W-40}px;height:28px;font-size:25px">${o.name}</div>`;
 html+=`<div class="t" style="left:80px;top:${H-46}px;width:${W-160}px;height:36px;gap:10px;font-family:var(--disp);font-size:17px;letter-spacing:.12em;color:#b8a57e">${o.lv}<span style="color:#8fc9a0;letter-spacing:-.05em;font-size:21px">${'›'.repeat(o.spd)}</span></div>`;
 if(o.kw) html+=`<div class="t" style="left:20px;top:24px;width:${W-40}px;height:30px;justify-content:flex-start"><span class="chip" style="font-size:16px;padding:4px 12px">${o.kw}</span></div>`;
 if(o.held){const hc='h'+(++uid);svg+=`<defs><clipPath id="${hc}"><circle cx="${W-44}" cy="44" r="24"/></clipPath></defs><image href="${ART(o.held)}" x="${W-68}" y="20" width="48" height="48" clip-path="url(#${hc})" preserveAspectRatio="xMidYMid slice"/><circle cx="${W-44}" cy="44" r="24.5" fill="none" stroke="url(#${f.br})" stroke-width="2"/>`;}
 return `<svg class="fr" viewBox="0 0 ${W} ${H}"><defs>${f.defs}</defs>${svg}</svg>${html}`;
}

let h='';
const put=(x,y,w,inner,extra='')=>h+=`<div class="cw" style="left:${x}px;top:${y}px;transform:scale(${w/W});${extra}">${inner}</div>`;
h+=`<div class="lab" style="left:40px;top:22px">Full cards · 340 × 476 · one silhouette trait per card type</div>`;
const FW=290,FY=54,gap=24;let X=40;
put(X,FY,FW,card({kind:'pokemon',type:'fire',art:'charizard',name:'Charizard',typeLine:'Fire · Special',cost:4,lv:7,spd:3,at:'sa',a:8,gt:'hp',s:9,kw:['Overrun'],rules:'<div><b>On Summon</b> · 2 damage to each enemy Pokémon.</div>'})); X+=FW+gap;
put(X,FY,FW,card({kind:'command',type:'elec',art:'thunderbolt',name:'Thunderbolt',typeLine:'Command · Electric',cost:3,modes:[{n:'React',c:2,t:'2 damage',off:true},{n:'Adapt',c:3,t:'4 damage'},{n:'Strat',c:4,t:'6 damage'}]})); X+=FW+gap;
put(X,FY,FW,card({kind:'supporter',type:'sup',icon:'sup',art:'nurse-joy',name:'Nurse Joy',typeLine:'Supporter · Release 1',cost:1,costKind:'seal',rules:'<div>Heal each of your Pokémon 2.</div>',fav:'Release a Water Pokémon: heal 4 instead. <b>+3 Recognition.</b>'})); X+=FW+gap;
