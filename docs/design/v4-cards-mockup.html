<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,500&family=Cinzel:wght@700;800;900&display=swap">
<style>
:root{--disp:'Cinzel',Georgia,serif;--text:'Alegreya Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:var(--text);color:#f6ead0;
 background:radial-gradient(ellipse at 50% 35%,#3b2614 0%,#1a0e06 65%,#0b0603 100%)}
.lab{position:absolute;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.14em;color:#d1a95a;text-transform:uppercase}
.call{position:absolute;font-size:13.5px;color:#e8d6ae;line-height:1.3}
.call b{color:#ffd27a}
/* a card is always authored at 300x420 and scaled */
.cw{position:absolute;width:300px;height:420px;transform-origin:0 0}
.cw svg.fr{position:absolute;left:-20px;top:-20px;width:340px;height:460px;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.75))}
.t{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center}
.name{font-family:var(--disp);font-weight:900;color:#fff4d8;letter-spacing:.03em;text-shadow:0 2px 0 #000;white-space:nowrap}
.sub{font-weight:800;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.rules{font-size:13.5px;line-height:1.22;color:#f3e6c8;text-shadow:0 1px 2px #000;flex-direction:column;gap:3px}
.rules b{color:#ffd27a;font-weight:800}
.num{font-family:var(--disp);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.75),0 0 8px rgba(0,0,0,.6)}
.kw{position:absolute;right:26px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kw span{font-weight:800;font-size:11px;letter-spacing:.04em;padding:2px 9px;border-radius:9px;background:rgba(12,6,2,.84);border:1px solid rgba(255,220,150,.6);color:#ffe2a6;white-space:nowrap}
.mode{position:absolute;left:30px;right:30px;height:22px;display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.mode .c{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:12px;color:#fff;background:radial-gradient(circle at 38% 30%,#cfe8ff,#3f86e0 55%,#163f8a);border:1.5px solid #ffe7a8}
.mode b{font-family:var(--disp);font-size:10.5px;letter-spacing:.1em;color:#ffd27a;width:46px;flex:none;text-align:left}
.mode.off{opacity:.35}
.holo .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55}
.dim{filter:brightness(.55) saturate(.6)}
</style></head><body>
<div id="app"></div>
<script>
const ART=(n)=>`../../assets/cards/${n}.jpg`;
const G={ // stat glyphs (small, inside sockets)
 pa:'<path d="M4 15C6 10 9 6 15 3M8 19c2.5-5 6-9 12-12M12 22c2-4 5-7 9-9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>',
 sa:'<path d="M12 1.5l2.4 8.1L22.5 12l-8.1 2.4L12 22.5l-2.4-8.1L1.5 12l8.1-2.4z" fill="currentColor"/>',
 hp:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>',
 def:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/>',
 sdef:'<path d="M12 2l8.6 5v10L12 22l-8.6-5V7z" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/>',
 fire:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 0-6 0-9z" fill="#fff"/>',
 water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" fill="#fff"/>',
 elec:'<path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="#fff"/>',
 sup:'<circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7z" fill="#fff"/>',
 item:'<path d="M9 3h6v3l3 4v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9l3-4z" fill="#fff"/>',
 trn:'<path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z" fill="#fff"/>',
 loc:'<path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z" fill="#fff"/><circle cx="12" cy="9" r="2.6" fill="#333"/>',
};
const STATC={pa:['#ffb27a','#a8400e'],sa:['#e2c0ff','#5e2aa8'],hp:['#ffa0ac','#a81e36'],def:['#f0f4fa','#5a6474'],sdef:['#b0f4ff','#13708c']};
const T={fire:['#ffe0a0','#b4471a','#ff9a50'],water:['#d0eeff','#1f5aa0','#8cc8ff'],elec:['#fff3b0','#a07a10','#ffe060'],
 rock:['#efe0bc','#6a5434','#d8c090'],sup:['#ffe0d4','#8a1e2a','#ff9a8a'],item:['#e4fff4','#1e7a64','#7ff0c8'],trn:['#fff0c8','#5a2a9a','#d8b0ff'],loc:['#f4e4c0','#7a5a2a','#ffd27a']};
let uid=0;
function defs(type){const [a,b]=T[type];const id='m'+(++uid);
 return [id,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".28" stop-color="${b}"/><stop offset=".5" stop-color="${a}"/><stop offset=".74" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient>`];}
// layered metal stroke: dark under-band, metal band, bright ridge
const metal=(d,m,w=11)=>`<path d="${d}" fill="none" stroke="#120802" stroke-width="${w+5}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="url(#${m})" stroke-width="${w}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="rgba(255,250,225,.7)" stroke-width="1.2" stroke-linejoin="round"/>`;
const enamel=(id,a,b)=>`<radialGradient id="${id}" cx="40%" cy="28%" r="80%"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="#140804"/></radialGradient>`;
const glyph=(k,x,y,s,col)=>`<svg x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${col}">${G[k]}</svg>`;
const shift=(d)=>d; // paths authored in card space; svg is offset by 20px
function svgWrap(inner,defsStr){return `<svg class="fr" viewBox="-20 -20 340 460"><defs>${defsStr}</defs>${inner}</svg>`;}
function artLayer(path,art,fx=50,fy=35,scrimFrom=.58){const c='c'+(++uid),g='s'+uid;
 return [`<clipPath id="${c}"><path d="${path}"/></clipPath><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="${scrimFrom}" stop-color="#0c0602" stop-opacity="0"/><stop offset="${scrimFrom+.14}" stop-color="#0c0602" stop-opacity=".82"/><stop offset="1" stop-color="#080401" stop-opacity=".97"/></linearGradient>`,
 `<g clip-path="url(#${c})"><image href="${ART(art)}" x="0" y="0" width="300" height="420" preserveAspectRatio="xMidYMid slice" style="object-position:${fx}% ${fy}%"/><rect width="300" height="420" fill="url(#${g})"/></g>`];}
const ribbon=(y,h,m,x1=22,x2=278)=>{const mid=y+h/2;return `<path d="M${x1},${y} H${x2} L${x2+14},${mid} L${x2},${y+h} H${x1} L${x1-14},${mid} Z" fill="url(#rb)" stroke="url(#${m})" stroke-width="3"/><path d="M${x1+6},${y+4} H${x2-6}" stroke="rgba(255,240,200,.25)" stroke-width="1"/>`;};
const RB=`<linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2410"/><stop offset="1" stop-color="#140a03"/></linearGradient>`;
const cost=(cx,cy,r,n,m,kind='energy')=>{const id='e'+(++uid);
 const fill=kind==='money'?enamel(id,'#fff3b8','#c8961e'):kind==='seal'?enamel(id,'#ffb8a8','#a8202a'):enamel(id,'#d4ecff','#2f74d0');
 const col=kind==='money'?'#3a2205':'#fff';
 let shape=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`;
 if(kind==='seal'){let p='';for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,rr=r+(i%2?3:-1);p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);}shape=`<path d="${p}Z" fill="url(#${id})"/>`;}
 return {d:fill,s:`<circle cx="${cx}" cy="${cy}" r="${r+7}" fill="#120802"/><circle cx="${cx}" cy="${cy}" r="${r+5}" fill="url(#${m})"/>${shape}<ellipse cx="${cx-r*.25}" cy="${cy-r*.4}" rx="${r*.45}" ry="${r*.22}" fill="rgba(255,255,255,.35)"/>`,
  t:`<div class="t num" style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px;font-size:${r*1.05}px;color:${col};${kind==='money'?'text-shadow:0 1px 0 rgba(255,255,255,.4)':''}">${n}</div>`};};
const crest=(cx,cy,r,type,m,icon)=>{const id='k'+(++uid);const [a,b,c]=T[type];
 return {d:enamel(id,c,b),s:`<circle cx="${cx}" cy="${cy}" r="${r+4}" fill="url(#${m})"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>${glyph(icon||type,cx,cy,r*1.2,'#fff')}`};};

// ===== Pokémon (unit): arched crown, integrated cost medallion, stat bastions in the frame =====
const P_BODY='M14,76 C14,46 38,30 70,26 Q150,8 230,26 C262,30 286,46 286,76 V392 Q286,406 272,406 H28 Q14,406 14,392 Z';
const PL='M8,346 H70 Q84,346 90,358 L98,384 Q104,412 80,414 H24 Q8,414 8,398 Z';           // attack bastion
const PR='M292,346 H230 Q216,346 210,358 L202,384 Q196,412 220,414 H276 Q292,414 292,398 Z'; // strength bastion
function pokemon(o){
 const [m,md]=defs(o.type);const [ad,al]=artLayer(P_BODY,o.art,o.fx,o.fy,o.lod==='full'?.5:.6);
 const c=cost(46,52,25,o.cost,m);const cr=crest(258,50,15,o.type,m);
 const ea='a'+(++uid),eb='b'+uid;const [a1,a2]=STATC[o.at],[b1,b2]=STATC[o.gt];
 const sock=`<path d="${PL}" fill="url(#${ea})" stroke="#120802" stroke-width="7"/><path d="${PL}" fill="url(#${ea})" stroke="url(#${m})" stroke-width="3.5"/>${glyph(o.at,53,364,15,a1)}
   <path d="${PR}" fill="url(#${eb})" stroke="#120802" stroke-width="7"/><path d="${PR}" fill="url(#${eb})" stroke="url(#${m})" stroke-width="3.5"/>${glyph(o.gt,247,364,15,b1)}`;
 const full=o.lod==='full';
 const rib=full?ribbon(250,34,m):ribbon(272,40,m);
 const svg=svgWrap(`${al}${metal(P_BODY,m)}${rib}${sock}${c.s}${cr.s}${o.holo?'':''}`,`${md}${ad}${RB}${c.d}${cr.d}${enamel(ea,a1,a2)}${enamel(eb,b1,b2)}`);
 let txt=c.t+`<div class="t num" style="left:16px;top:368px;width:76px;height:40px;font-size:31px">${o.a}</div><div class="t num" style="left:208px;top:368px;width:76px;height:40px;font-size:31px;${o.hurt?'color:#ff7a68':''}">${o.s}</div>`;
 if(o.lod==='full') txt+=`<div class="t" style="left:24px;top:80px;width:44px;height:16px"><span class="sub" style="color:#ffe3a0;font-family:var(--disp);letter-spacing:.06em;font-size:11px;background:rgba(12,6,2,.8);border:1px solid #b08a3a;border-radius:6px;padding:1px 6px">Lv ${o.lv}</span></div>`;
 txt+=`<div class="t" style="left:104px;top:386px;width:92px;height:18px;color:#7ee0a0;font-weight:900;font-size:17px;letter-spacing:-2px;text-shadow:0 1px 2px #000">${'›'.repeat(o.spd)}</div>`;
 if(full){
  txt+=`<div class="kw" style="top:76px">${(o.kw||[]).map(k=>`<span>${k}</span>`).join('')}</div>`;
  txt+=`<div class="t name" style="left:20px;top:250px;width:260px;height:34px;font-size:22px">${o.name}</div>`;
  txt+=`<div class="t sub" style="left:20px;top:288px;width:260px;height:14px;color:${T[o.type][2]}">${o.sub}</div>`;
  txt+=`<div class="t rules" style="left:30px;top:304px;width:240px;height:42px">${o.rules}</div>`;
 } else {
  if(o.tag) txt+=`<div class="t" style="left:60px;top:240px;width:180px;height:24px"><span class="sub" style="font-size:15px;letter-spacing:.06em;color:#ffe2a6;background:rgba(12,6,2,.84);border:1.5px solid rgba(255,220,150,.6);border-radius:12px;padding:2px 12px">${o.tag}</span></div>`;
  if(o.kw&&o.kw.length) txt+=`<div class="kw" style="top:76px">${o.kw.map(k=>`<span style="font-size:15px">${k}</span>`).join('')}</div>`;
  txt+=`<div class="t name" style="left:20px;top:272px;width:260px;height:40px;font-size:29px">${o.name}</div>`;
 }
 return svg+txt;}

// ===== Command (a move): chamfered shield that narrows to a point, cost set in the top =====
const C_BODY='M48,32 H252 L286,64 V316 L150,410 L14,316 V64 Z';
function command(o){
 const [m,md]=defs(o.type);const [ad,al]=artLayer(C_BODY,o.art,o.fx,o.fy,o.lod==='full'?.4:.55);
 const c=cost(150,28,24,o.cost,m);const cr=crest(150,366,15,o.type,m);
 const full=o.lod==='full';
 const svg=svgWrap(`${al}${metal(C_BODY,m)}${full?ribbon(198,32,m):ribbon(236,40,m)}${c.s}${cr.s}`,`${md}${ad}${RB}${c.d}${cr.d}`);
 let txt=c.t;
 if(full){
  txt+=`<div class="t name" style="left:20px;top:198px;width:260px;height:32px;font-size:21px">${o.name}</div>`;
  txt+=`<div class="t sub" style="left:20px;top:234px;width:260px;height:14px;color:${T[o.type][2]}">Command · ${o.target}</div>`;
  o.modes.forEach((md2,i)=>txt+=`<div class="mode ${md2.off?'off':''}" style="top:${254+i*26}px"><span class="c">${md2.c}</span><b>${md2.n}</b><span>${md2.t}</span></div>`);
 } else {
  txt+=`<div class="t name" style="left:20px;top:236px;width:260px;height:40px;font-size:28px">${o.name}</div>`;
  txt+=`<div class="t" style="left:30px;top:284px;width:240px;height:30px;gap:8px">${o.modes.filter(x=>!x.off).map(x=>`<span class="sub" style="font-size:14px;letter-spacing:.06em;color:#ffd27a;background:rgba(12,6,2,.84);border:1.5px solid rgba(255,220,150,.5);border-radius:8px;padding:2px 9px">${x.n} ${x.c}</span>`).join('')}</div>`;
 }
 return svg+txt;}

// ===== Supporter: tall arched window, red wax Release seal =====
const S_BODY='M14,176 C14,90 74,22 150,22 C226,22 286,90 286,176 V392 Q286,406 272,406 H28 Q14,406 14,392 Z';
function supporter(o){
 const [m,md]=defs('sup');const [ad,al]=artLayer(S_BODY,o.art,o.fx,o.fy,o.lod==='full'?.5:.6);
 const c=cost(50,82,22,o.rel,m,'seal');const cr=crest(250,82,14,'sup',m,'sup');
 const full=o.lod==='full';
 const fav=full?`<path d="M30,340 H270 Q278,340 278,348 V388 Q278,396 270,396 H30 Q22,396 22,388 V348 Q22,340 30,340Z" fill="rgba(60,40,8,.75)" stroke="url(#${m})" stroke-width="2"/>`:'';
 const svg=svgWrap(`${al}${metal(S_BODY,m)}${full?ribbon(246,34,m):ribbon(272,40,m)}${fav}${c.s}${cr.s}`,`${md}${ad}${RB}${c.d}${cr.d}`);
 let txt=c.t.replace(/font-size:[^;]+;/,'font-size:22px;padding-bottom:6px;')+`<div class="t" style="left:28px;top:93px;width:44px;height:12px;font-size:7.5px;font-weight:800;letter-spacing:.08em;color:#ffe0d6;text-shadow:0 1px 1px #000">RELEASE</div>`;
 if(full){
  txt+=`<div class="t name" style="left:20px;top:246px;width:260px;height:34px;font-size:22px">${o.name}</div>`;
  txt+=`<div class="t sub" style="left:20px;top:284px;width:260px;height:14px;color:${T.sup[2]}">Supporter</div>`;
  txt+=`<div class="t rules" style="left:30px;top:302px;width:240px;height:34px">${o.rules}</div>`;
  txt+=`<div class="t rules" style="left:30px;top:342px;width:240px;height:52px;font-size:12.5px"><div><b style="color:#ffd040">★ Favour</b> · Release ${o.fav[0]}</div><div>${o.fav[1]} <b>+3 Recognition</b></div></div>`;
 } else txt+=`<div class="t name" style="left:20px;top:272px;width:260px;height:40px;font-size:28px">${o.name}</div>`;
 return svg+txt;}

// ===== Item: a shop tag with a punched eyelet; gold price coin =====
const I_BODY='M40,16 H128 Q134,16 136,22 A14,14 0 0 0 164,22 Q166,16 172,16 H260 Q286,16 286,42 V380 Q286,406 260,406 H40 Q14,406 14,380 V42 Q14,16 40,16 Z';
function item(o){
 const [m,md]=defs('item');const [ad,al]=artLayer(I_BODY,o.art,o.fx,o.fy,o.lod==='full'?.5:.6);
 const c=cost(44,46,24,'$'+o.price,m,'money');const cr=crest(256,46,14,'item',m,'item');
 const full=o.lod==='full';
 const stock=full?Array.from({length:o.stock},(_,i)=>` <rect x="${150-o.stock*9+i*18+3}" y="362" width="12" height="12" rx="3" fill="${i<o.left?'#7ff0c8':'none'}" stroke="#7ff0c8" stroke-width="1.5"/>`).join(''):'';
 const svg=svgWrap(`${al}${metal(I_BODY,m)}<circle cx="150" cy="22" r="9" fill="#0c0602" stroke="url(#${m})" stroke-width="3"/>${full?ribbon(254,34,m):ribbon(272,40,m)}${stock}${c.s}${cr.s}`,`${md}${ad}${RB}${c.d}${cr.d}`);
 let txt=c.t.replace(/font-size:[^;]+;/,'font-size:21px;');
 if(full){
  txt+=`<div class="t name" style="left:20px;top:254px;width:260px;height:34px;font-size:22px">${o.name}</div>`;
  txt+=`<div class="t sub" style="left:20px;top:292px;width:260px;height:14px;color:${T.item[2]}">Item · ${o.kind}</div>`;
  txt+=`<div class="t rules" style="left:30px;top:312px;width:240px;height:40px">${o.rules}</div>`;
  txt+=`<div class="t sub" style="left:20px;top:380px;width:260px;height:12px;font-size:9.5px;color:#9fe8cc">Stock · ${o.left} turns left</div>`;
 } else txt+=`<div class="t name" style="left:20px;top:272px;width:260px;height:40px;font-size:28px">${o.name}</div>`;
 return svg+txt;}

// ===== Trainer: a crowned frame; the Objective track is built into the base =====
const R_BODY='M14,84 L62,50 L104,70 L150,22 L196,70 L238,50 L286,84 V392 Q286,406 272,406 H28 Q14,406 14,392 Z';
function trainer(o){
 const [m,md]=defs('trn');const [ad,al]=artLayer(R_BODY,o.art,o.fx,o.fy,.48);
 const c=cost(44,110,22,o.cost,m);const cr=crest(150,36,13,'trn',m,'trn');
 const base=`<path d="M22,344 H278 V392 Q278,398 272,398 H28 Q22,398 22,392 Z" fill="rgba(30,10,50,.8)" stroke="url(#${m})" stroke-width="2"/>`;
 const pips=Array.from({length:o.need},(_,i)=>`<circle cx="${40+i*22}" cy="378" r="7" fill="${i<o.prog?'#ffd27a':'none'}" stroke="#ffd27a" stroke-width="2"/>`).join('');
 const pc='p'+(++uid);
 const svg=svgWrap(`${al}${metal(R_BODY,m)}${ribbon(246,34,m)}${base}${pips}<clipPath id="${pc}"><circle cx="252" cy="371" r="20"/></clipPath><image href="${ART(o.partner)}" x="226" y="345" width="52" height="52" clip-path="url(#${pc})" preserveAspectRatio="xMidYMid slice"/><circle cx="252" cy="371" r="21" fill="none" stroke="url(#${m})" stroke-width="3"/>${c.s}${cr.s}`,`${md}${ad}${RB}${c.d}${cr.d}`);
 let txt=c.t;
 txt+=`<div class="t name" style="left:20px;top:246px;width:260px;height:34px;font-size:22px">${o.name}</div>`;
 txt+=`<div class="t sub" style="left:20px;top:284px;width:260px;height:14px;color:${T.trn[2]}">Trainer</div>`;
 txt+=`<div class="t rules" style="left:30px;top:302px;width:240px;height:38px"><div><b>Command:</b> ${o.cmd}</div><div><b style="color:#e0c0ff">Objective:</b> ${o.obj}</div></div>`;
 txt+=`<div class="t sub" style="left:28px;top:350px;width:190px;height:12px;font-size:9px;color:#e0c0ff;justify-content:flex-start">Objective ${o.prog} / ${o.need} · Partner</div>`;
 return svg+txt;}

// ===== Location: a map scroll with rolled ends =====
const L_BODY='M22,34 H278 V386 H22 Z';
function locCard(o){
 const [m,md]=defs('loc');const [ad,al]=artLayer(L_BODY,o.art,o.fx,o.fy,.5);
 const roll=(y)=>`<rect x="6" y="${y}" width="288" height="26" rx="13" fill="url(#rl)" stroke="#120802" stroke-width="2"/><rect x="2" y="${y+5}" width="10" height="16" rx="4" fill="url(#${m})"/><rect x="288" y="${y+5}" width="10" height="16" rx="4" fill="url(#${m})"/>`;
 const RL=`<linearGradient id="rl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2dca8"/><stop offset=".45" stop-color="#a88450"/><stop offset="1" stop-color="#4a3418"/></linearGradient>`;
 const cr=crest(150,48,13,'loc',m,'loc');
 const svg=svgWrap(`${al}${metal(L_BODY,m,7)}${roll(16)}${roll(376)}${ribbon(246,34,m)}${cr.s}`,`${md}${ad}${RB}${RL}${cr.d}`);
 let txt=`<div class="t name" style="left:20px;top:246px;width:260px;height:34px;font-size:22px">${o.name}</div>`;
 txt+=`<div class="t sub" style="left:20px;top:284px;width:260px;height:14px;color:#ffd27a">Location · ${o.lanes} lanes · ${o.rounds} Rounds</div>`;
 txt+=`<div class="t rules" style="left:30px;top:304px;width:240px;height:34px">${o.rules}</div>`;
 txt+=`<div class="t" style="left:30px;top:342px;width:240px;height:26px;gap:8px"><span class="sub" style="font-size:11px;letter-spacing:.04em;color:#ffc067;background:rgba(255,160,40,.2);border:1px solid #a86a20;border-radius:10px;padding:2px 9px">☀ +2 Sun</span><span class="sub" style="font-size:11px;letter-spacing:.04em;color:#f3e6c8;background:rgba(12,6,2,.7);border:1px solid rgba(255,220,150,.4);border-radius:10px;padding:2px 9px">Dominate · +3</span></div>`;
 return svg+txt;}

// ===== Board token: the Pokémon unit frame, art-first =====
function token(o){
 const [m,md]=defs(o.type);const [ad,al]=artLayer(P_BODY,o.art,o.fx,o.fy,.68);
 const ea='a'+(++uid),eb='b'+uid;const [a1,a2]=STATC[o.at],[b1,b2]=STATC[o.gt];
 const sock=`<path d="${PL}" fill="url(#${ea})" stroke="#120802" stroke-width="7"/><path d="${PL}" fill="url(#${ea})" stroke="url(#${m})" stroke-width="3.5"/>${glyph(o.at,53,364,15,a1)}
   <path d="${PR}" fill="url(#${eb})" stroke="#120802" stroke-width="7"/><path d="${PR}" fill="url(#${eb})" stroke="url(#${m})" stroke-width="3.5"/>${glyph(o.gt,247,364,15,b1)}`;
 const held=o.held?(()=>{const hc='h'+(++uid);return `<clipPath id="${hc}"><circle cx="256" cy="64" r="20"/></clipPath><circle cx="256" cy="64" r="24" fill="url(#${m})"/><image href="${ART(o.held)}" x="232" y="40" width="48" height="48" clip-path="url(#${hc})" preserveAspectRatio="xMidYMid slice"/>`;})():'';
 const svg=svgWrap(`${al}${metal(P_BODY,m,13)}${ribbon(300,38,m,30,270)}${sock}${held}`,`${md}${ad}${RB}${enamel(ea,a1,a2)}${enamel(eb,b1,b2)}`);
 let txt=`<div class="t num" style="left:16px;top:368px;width:76px;height:40px;font-size:34px">${o.a}</div><div class="t num" style="left:208px;top:368px;width:76px;height:40px;font-size:34px;${o.hurt?'color:#ff7a68':''}">${o.s}</div>`;
 txt+=`<div class="t name" style="left:24px;top:300px;width:252px;height:38px;font-size:26px">${o.name}</div>`;
 txt+=`<div class="t" style="left:22px;top:34px;width:70px;height:26px"><span class="sub" style="color:#ffe3a0;font-family:var(--disp);letter-spacing:.06em;font-size:18px;background:rgba(12,6,2,.82);border:1.5px solid #b08a3a;border-radius:8px;padding:1px 9px">${o.lv}</span></div>`;
 if(o.kw) txt+=`<div class="kw" style="left:24px;right:auto;top:72px;align-items:flex-start">${o.kw.map(k=>`<span style="font-size:17px">${k}</span>`).join('')}</div>`;
 txt+=`<div class="t" style="left:104px;top:376px;width:92px;height:26px;color:#7ee0a0;font-weight:900;font-size:26px;letter-spacing:-3px;text-shadow:0 1px 2px #000">${'›'.repeat(o.spd)}</div>`;
 return svg+txt;}

let h='';
const put=(x,y,w,inner,extra='',cls='')=>h+=`<div class="cw ${cls}" style="left:${x}px;top:${y}px;transform:scale(${w/300});${extra}">${inner}</div>`;

// Row 1 — full cards
h+=`<div class="lab" style="left:40px;top:20px">Full cards · a unique silhouette for each card type (Codex & hover size)</div>`;
const W=262,Y=58;let X=36;const step=W+48;
put(X,Y,W,pokemon({lod:'full',type:'fire',art:'charizard',name:'Charizard',lv:7,cost:4,sub:'Fire · Special',spd:3,at:'sa',a:8,gt:'hp',s:9,kw:['Overrun'],fy:30,
 rules:'<div><b>On Summon:</b> 2 damage to each enemy Pokémon.</div>'})); X+=step;
put(X,Y,W,command({lod:'full',type:'elec',art:'thunderbolt',name:'Thunderbolt',target:'an enemy Pokémon',cost:3,
 modes:[{n:'REACT',c:2,t:'2 damage',off:true},{n:'ADAPT',c:3,t:'4 damage'},{n:'STRAT',c:4,t:'6 damage'}]})); X+=step;
put(X,Y,W,supporter({lod:'full',art:'nurse-joy',name:'Nurse Joy',rel:1,rules:'<div>Heal each of your Pokémon 2.</div>',fav:['a Water Pokémon:','heal 4 instead ·']})); X+=step;
put(X,Y,W,item({lod:'full',art:'rocky-helmet',name:'Rocky Helmet',price:3,kind:'Held',stock:4,left:3,rules:'<div>The holder has <b>Retaliate 2</b>.</div>'})); X+=step;
put(X,Y,W,trainer({art:'misty',name:'Misty',cost:2,cmd:'draw 2 cards.',obj:'defeat 8 enemy Pokémon.',need:8,prog:3,partner:'starmie'})); X+=step;
put(X,Y,W,locCard({art:'mt-ember',name:'Mt. Ember',lanes:3,rounds:3,rules:'<div>Pokémon here have <b>+1 Attack</b>.</div>'}));

// Row 2 — hand (mini)
h+=`<div class="lab" style="left:40px;top:470px">Hand · the same frames, cut down to art, cost, name and stats</div>`;
const hw=150,hy=510;
const hand=[
 pokemon({lod:'mini',type:'fire',art:'growlithe',name:'Growlithe',lv:3,cost:2,spd:3,at:'pa',a:3,gt:'hp',s:4,tag:'On Summon',fy:40}),
 pokemon({lod:'mini',type:'elec',art:'shinx',name:'Shinx',lv:2,cost:1,spd:3,at:'pa',a:2,gt:'hp',s:3,tag:'On Summon',fy:38}),
 command({lod:'mini',type:'fire',art:'ember',name:'Ember',target:'an enemy',cost:2,modes:[{n:'ADAPT',c:2},{n:'STRAT',c:3}]}),
 supporter({lod:'mini',art:'professor-oak',name:'Prof. Oak',rel:1}),
 item({lod:'mini',art:'potion',name:'Potion',price:2,kind:'Consumed'}),
 pokemon({lod:'mini',type:'water',art:'wooper',name:'Wooper',lv:2,cost:1,spd:1,at:'pa',a:2,gt:'def',s:4,tag:'On Summon',kw:['Regen 1'],fy:40}),
];
hand.forEach((c,i)=>put(40+i*126,hy+Math.abs(i-2.5)*5,hw,c,`rotate:${(i-2.5)*2.5}deg;`));
h+=`<div class="call" style="left:40px;top:745px;width:780px">Hand cards keep their frame shape, cost and stat sockets, with the name large and one tag ("On Summon", "ADAPT 2 · STRAT 3"). Hovering lifts a card to its full size above the hand. Text never shrinks below a readable size: if it doesn't fit, the card gets a shorter wording, not a smaller font.</div>`;

// Row 2 — board tokens
h+=`<div class="lab" style="left:880px;top:470px">On the board · the unit frame, art first</div>`;
h+=`<div style="position:absolute;left:870px;top:500px;width:700px;height:300px;border-radius:14px;background:linear-gradient(rgba(14,8,3,.35),rgba(14,8,3,.55)),url(${ART('mt-ember')}) center/cover;border:2px solid #f39a4a;box-shadow:inset 0 0 40px rgba(0,0,0,.7)"></div>`;
const tw=150,ty=530;
put(895,ty,tw,token({type:'fire',art:'charizard',name:'Charizard',lv:'Lv 7',spd:3,at:'sa',a:8,gt:'hp',s:9,kw:['Overrun'],held:'charcoal',fy:30}),'filter:drop-shadow(0 0 16px rgba(255,200,80,.9)) drop-shadow(0 0 30px rgba(255,170,40,.5));');
put(1065,ty,tw,token({type:'water',art:'blastoise',name:'Blastoise',lv:'Lv 6',spd:2,at:'sa',a:5,gt:'def',s:4,hurt:1,kw:['Shell 1']}));
put(1235,ty+6,tw,token({type:'elec',art:'lanturn',name:'Lanturn',lv:'Lv 4',spd:2,at:'sa',a:3,gt:'sdef',s:5}),'filter:grayscale(.8) brightness(.55);rotate:-6deg;');
put(1405,ty,tw,token({type:'fire',art:'ninetales',name:'Ninetales',lv:'★',spd:2,at:'sa',a:9,gt:'hp',s:11}));
h+=`<div class="call" style="left:880px;top:815px;width:690px">Ready = gold glow (Charizard) · damaged = red Strength (Blastoise) · Spent = grey and tilted (Lanturn) · Partner = ★ and holo (Ninetales). The art is framed on each card's focal point.</div>`;

// Row 2 — the socket legend
h+=`<div class="lab" style="left:1620px;top:470px">Stat sockets</div>`;
const leg=[['pa','Physical Attack'],['sa','Special Attack'],['hp','Hitpoints'],['def','Defence'],['sdef','Special Defence']];
leg.forEach(([k,l],i)=>{const [a,b]=STATC[k];h+=`<div style="position:absolute;left:1620px;top:${504+i*44}px;display:flex;align-items:center;gap:12px;font-size:15px"><span style="width:44px;height:34px;border-radius:6px 6px 14px 14px;background:radial-gradient(circle at 40% 28%,${a},${b} 60%,#140804);border:2px solid #f2d48a;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" style="color:${a};filter:drop-shadow(0 1px 1px #000)">${G[k]}</svg></span>${l}</div>`;});
h+=`<div class="call" style="left:1620px;top:730px;width:270px">The sockets are carved into the Pokémon frame. Their enamel colour and a small glyph say which stat it is, so the numbers sit in clean shapes.</div>`;

// Bottom — the text rules
h+=`<div class="lab" style="left:40px;top:880px">Neat text, guaranteed</div>`;
h+=`<div class="call" style="left:40px;top:908px;width:1840px;columns:3;column-gap:40px">
<b>Fixed text zones.</b> Every frame defines its zones (name ribbon, type line, rules box, mode rows, Favour box, stock line), and nothing is placed outside them.<br>
<b>One line for a name,</b> at a fixed size. Long names (Pokémon Breeder) use a tighter letter-spacing step, never a smaller font.<br>
<b>Rules fit their box</b> at 13.5 px (full) and are hidden on mini cards. A test renders every card at every size and fails on any overflow, overlap or clipped glyph.<br>
<b>Chips</b> (keywords, tags, mode chips) are one line each, stacked with fixed gaps, never touching another element.<br>
<b>Numbers</b> sit centred in their sockets with room for two digits.<br>
<b>Every card's wording</b> is written to fit its zone. Where it can't, the wording is shortened, and the full text is always in the Codex.
</div>`;
document.getElementById('app').innerHTML=h;
</script></body></html>
