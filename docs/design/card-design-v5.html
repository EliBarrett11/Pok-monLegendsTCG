<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cinzel; font-weight: 700; src: url(../fonts/fontsource-cinzel-5.3.0/files/cinzel-latin-700-normal.woff2); }
@font-face { font-family: Cinzel; font-weight: 800; src: url(../fonts/fontsource-cinzel-5.3.0/files/cinzel-latin-800-normal.woff2); }
@font-face { font-family: Alegreya; font-weight: 400; src: url(../fonts/fontsource-alegreya-sans-5.3.0/files/alegreya-sans-latin-400-normal.woff2); }
@font-face { font-family: Alegreya; font-weight: 800; src: url(../fonts/fontsource-alegreya-sans-5.3.0/files/alegreya-sans-latin-800-normal.woff2); }
:root { --brass: #d6ad5c; --parch: 246,234,204; --ink: #2b1d10; }
* { box-sizing: border-box; margin: 0; }
body { width: 1760px; height: 1000px; background: #1a0f08 url(A/ui/table.jpg) center/cover; font-family: Alegreya, sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 56px; }
.cards { display: flex; gap: 44px; }
.ico img { width: 100%; height: 100%; display: block; }

.card { --w: 380px; width: var(--w); aspect-ratio: 5/7; position: relative; border-radius: calc(var(--w)*.055);
  padding: calc(var(--w)*.045); background: url(A/ui/frame-pokemon.jpg) center/180%;
  box-shadow: 0 18px 40px rgba(0,0,0,.7), 0 0 0 1px #000, inset 0 0 0 2px rgba(255,220,150,.35); }
.inner { position: relative; width: 100%; height: 100%; border-radius: calc(var(--w)*.03); overflow: hidden;
  box-shadow: 0 0 0 2px var(--brass), 0 0 0 3px #3a2608, inset 0 0 18px rgba(0,0,0,.55); }
.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.name { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--w)*.03) calc(var(--w)*.18) calc(var(--w)*.045);
  background: linear-gradient(to bottom, rgba(var(--parch),.95) 60%, rgba(var(--parch),0)); text-align: center;
  font-family: Cinzel; font-weight: 800; font-size: calc(var(--w)*.07); color: var(--ink); }
.text { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--w)*.11) calc(var(--w)*.17) calc(var(--w)*.12);
  background: linear-gradient(to top, rgba(var(--parch),.94), rgba(var(--parch),.88) 62%, rgba(var(--parch),0));
  backdrop-filter: blur(1.5px); color: var(--ink); font-size: calc(var(--w)*.046); line-height: 1.22; text-align: center; }
.text .kw { font-weight: 800; font-size: 1.06em; display: block; }
.text .rem { font-style: italic; color: #5b4630; font-size: .9em; display: block; margin-top: .25em; }

.ico { position: absolute; z-index: 3; filter: drop-shadow(0 calc(var(--w)*.008) calc(var(--w)*.012) rgba(0,0,0,.6)); }
.ico .h { position: absolute; inset: -12.5%; -webkit-mask: var(--m) center/100% 100% no-repeat; mask: var(--m) center/100% 100% no-repeat; }
.ico .h.brass { background: linear-gradient(135deg, #f3d38a, #a8792c 50%, #6a4a18); transform: scale(1.025); }
.ico .h.dark { background: #2a1806; transform: scale(1.012); }
.ico .h.wood { background: url(A/ui/frame-pokemon.jpg) center/320%; box-shadow: inset 0 0 0 999px rgba(0,0,0,.08); }
.ico img { position: relative; }
.ico .num { z-index: 2; position: absolute; inset: 0; display: grid; place-items: center; font-family: Cinzel; font-weight: 800; color: #fff;
  -webkit-text-stroke: 2px #1a0d04; paint-order: stroke fill; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
.cost { top: calc(var(--w)*-.045); left: calc(var(--w)*-.045); width: calc(var(--w)*.23); height: calc(var(--w)*.23); }
.cost .num { font-size: calc(var(--w)*.1); padding-top: 4%; }
.type { top: calc(var(--w)*-.035); right: calc(var(--w)*-.035); width: calc(var(--w)*.19); height: calc(var(--w)*.19); }
.speed { top: calc(var(--w)*.2); left: calc(var(--w)*-.03); width: calc(var(--w)*.15); height: calc(var(--w)*.15); }
.rarity { bottom: calc(var(--w)*-.05); left: 50%; transform: translateX(-50%); width: calc(var(--w)*.16); height: calc(var(--w)*.16); }
.atk, .str { bottom: calc(var(--w)*-.05); width: calc(var(--w)*.24); height: calc(var(--w)*.24); }
.atk { left: calc(var(--w)*-.05); } .str { right: calc(var(--w)*-.05); }
.atk .num, .str .num { font-size: calc(var(--w)*.1); }
.str.hp .num { padding-bottom: 2%; padding-top: 6%; }

.board { --w: 168px; }
.board .text { display: none; }
.board .name { font-size: calc(var(--w)*.085); padding-left: calc(var(--w)*.22); padding-right: calc(var(--w)*.22); }
.board .speed { width: calc(var(--w)*.2); height: calc(var(--w)*.2); top: calc(var(--w)*.22); }
.board .atk, .board .str { width: calc(var(--w)*.32); height: calc(var(--w)*.32); }
.board .atk .num, .board .str .num { font-size: calc(var(--w)*.15); }
.board .cost { width: calc(var(--w)*.3); height: calc(var(--w)*.3); } .board .cost .num { font-size: calc(var(--w)*.14); }
.board .type { width: calc(var(--w)*.25); height: calc(var(--w)*.25); }
.board .rarity { display: none; }
.glow { box-shadow: 0 0 0 2px #ffd36b, 0 0 26px 6px rgba(255,190,70,.75), 0 18px 40px rgba(0,0,0,.7); }
.badge { position: absolute; z-index: 4; font-family: Cinzel; font-weight: 800; color: #fff; border-radius: 20px; padding: 1px 8px;
  font-size: 12px; border: 1px solid var(--brass); box-shadow: 0 2px 6px rgba(0,0,0,.7); }
.alert { top: 34%; left: 50%; transform: translateX(-50%); background: linear-gradient(#f6c24a, #b8781a); color: #2b1600; }
.burn { top: 30%; right: 8px; background: radial-gradient(circle at 40% 30%, #ffd36b, #e2531c 60%, #7a1606); }

.side { display: flex; flex-direction: column; gap: 28px; align-items: center; }
.label { font-family: Cinzel; font-weight: 700; color: #f3dca2; font-size: 16px; letter-spacing: .08em; text-shadow: 0 2px 6px #000; }
.boardrow { display: flex; gap: 30px; }
.legend { width: 470px; padding: 18px 20px; border-radius: 16px; color: #f6e6c0;
  background: linear-gradient(rgba(30,18,8,.9), rgba(20,12,6,.93)); border: 2px solid var(--brass); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
.legend h3 { font-family: Cinzel; font-weight: 800; font-size: 13px; letter-spacing: .1em; color: #f3d38a; margin: 10px 0 6px; }
.legend h3:first-child { margin-top: 0; }
.grid { display: grid; gap: 6px; grid-template-columns: repeat(5, 1fr); }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; text-align: center; }
.cell img { width: 54px; height: 54px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
</style></head><body>

<div class="cards" id="cards"></div>

<div class="side">
  <div class="label">On the board</div>
  <div class="boardrow" id="board"></div>
  
</div>

<script>
const I = (n) => `A/ui/icons/${n}.webp`;
const CARDS = [
  { id: 'arcanine', name: 'Arcanine', cost: 4, type: 'fire', speed: 'swift', rarity: 'rare', atkType: 'physical', atk: 5, strType: 'hitpoints', str: 5,
    kw: 'Overrun · Scorch 1', rem: 'Leftover damage from a knockout hits that Zone\'s Trainer. Its attacks apply Burn 1.' },
  { id: 'lapras', name: 'Lapras', cost: 4, type: 'water', speed: 'steady', rarity: 'rare', atkType: 'special', atk: 5, strType: 'hitpoints', str: 7,
    kw: 'On Summon', rem: 'Heal all friendly Pokémon in this Pokémon\'s Zone 2.' },
];
const ico = (cls, n, inner = '') => `<div class="ico ${cls}" style="--m:url(${I('halo-' + n)})"><div class="h brass"></div><div class="h dark"></div><div class="h wood"></div><img src="${I(n)}">${inner}</div>`;
function card(c, extra = '', badges = '', strNum = c.str, strColor = '') {
  return `<div class="card ${extra}">
    <div class="inner"><img class="art" src="A/cards/${c.id}.jpg"><div class="name">${c.name}</div>
      <div class="text"><span class="kw">${c.kw}</span><span class="rem">${c.rem}</span></div>${badges}</div>
    ${ico('cost', 'energy', `<div class="num">${c.cost}</div>`)}
    ${ico('type', 'type-' + c.type)}
    ${ico('speed', 'speed-' + c.speed)}
    ${ico('rarity', 'rarity-' + c.rarity)}
    ${ico('atk', 'attack-' + c.atkType, `<div class="num">${c.atk}</div>`)}
    ${ico('str hp', 'strength-' + c.strType, `<div class="num" style="${strColor}">${strNum}</div>`)}
  </div>`;
}
document.getElementById('cards').innerHTML = CARDS.map((c) => card(c)).join('');
document.getElementById('board').innerHTML =
  card(CARDS[0], 'board glow', '<div class="badge alert">ALERT</div>') +
  card(CARDS[1], 'board', '<div class="badge burn">🔥2</div>', 4, 'color:#ff9a8a');
</script>
</body></html>
