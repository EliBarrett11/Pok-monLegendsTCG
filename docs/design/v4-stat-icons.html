<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700;800&family=Cinzel:wght@700;800&display=swap">
<style>body{margin:0;width:1200px;height:520px;background:radial-gradient(ellipse at 50% 30%,#3a2412,#120904);font-family:'Alegreya Sans';color:#f4e7c9}
h1{font-family:Cinzel;font-size:26px;letter-spacing:.1em;color:#d1a95a;text-align:center;margin:26px 0 6px}
p.s{text-align:center;color:#c9b08a;margin:0 0 22px;font-size:17px}
.row{display:flex;justify-content:center;gap:26px}
.t{width:200px;height:210px;border-radius:14px;background:linear-gradient(rgba(62,38,18,.95),rgba(28,16,8,.97));border:1.5px solid #6b4a1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.t svg{width:84px;height:84px;filter:drop-shadow(0 0 10px rgba(0,0,0,.8))}.t b{font-family:Cinzel;font-size:17px}.t small{color:#c9b08a;font-size:14px;text-align:center;padding:0 10px}
.bar{display:flex;justify-content:center;gap:40px;margin-top:26px;font-size:26px;font-weight:800}.bar span{display:inline-flex;align-items:center;gap:8px}.bar svg{width:26px;height:26px}
.pa{color:#ff9a5a}.sa{color:#d9a6ff}.hp{color:#ff7a8a}.def{color:#d6dde8}.sdef{color:#6fe0ff}</style></head><body>
<h1>STAT ICONS</h1><p class="s">The attack icon shows Physical or Special. The Strength icon shows Hitpoints, Defence or Special Defence.</p>
<div class="row" id="r"></div><div class="bar" id="b"></div>
<script>
const S={pa:'<path d="M4 15C6 10 9 6 15 3M8 19c2.5-5 6-9 12-12M12 22c2-4 5-7 9-9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>',
sa:'<path d="M12 1.5l2.4 8.1L22.5 12l-8.1 2.4L12 22.5l-2.4-8.1L1.5 12l8.1-2.4z" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/>',
hp:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>',
def:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/><path d="M12 5v14" stroke="rgba(0,0,0,.45)" stroke-width="2"/>',
sdef:'<path d="M12 2l8.6 5v10L12 22l-8.6-5V7z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 7.5l1.4 3.1 3.1 1.4-3.1 1.4L12 16.5l-1.4-3.1L7.5 12l3.1-1.4z" fill="currentColor"/>'};
const v=k=>`<svg viewBox="0 0 24 24" class="${k}">${S[k]}</svg>`;
const T=[['pa','Physical Attack','Claw slashes'],['sa','Special Attack','Energy burst'],['hp','Hitpoints','Heart · no guard'],['def','Defence','Shield · guards vs Physical'],['sdef','Special Defence','Barrier · guards vs Special']];
r.innerHTML=T.map(([k,n,d])=>`<div class="t">${v(k)}<b class="${k}">${n}</b><small>${d}</small></div>`).join('');
b.innerHTML=`<span>${v('pa')} 6 &nbsp; ${v('def')} 7</span><span>${v('sa')} 9 &nbsp; ${v('hp')} 9</span><span>${v('sa')} 5 &nbsp; ${v('sdef')} 6</span>`;
</script></body></html>
